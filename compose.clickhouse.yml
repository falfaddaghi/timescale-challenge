services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8080}
      DB_ENGINE: clickhouse
      DATABASE_URL: clickhouse://default:@clickhouse:8123/logs
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: logs
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8082}:${API_PORT:-8080}"

volumes:
  clickhouse-data:
  clickhouse-logs:
