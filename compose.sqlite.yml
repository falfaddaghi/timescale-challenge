services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8080}
      DB_ENGINE: sqlite
      DATABASE_URL: sqlite:///data/logs.sqlite
      SQLITE_PATH: /data/logs.sqlite
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
    ports:
      - "${API_HOST_PORT:-8081}:${API_PORT:-8080}"
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
