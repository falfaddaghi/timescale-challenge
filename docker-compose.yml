services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TIMESCALE_HOST_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8080}
      DB_ENGINE: timescale
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/logs
      DB_POOL_MAX: 20
      RETENTION_DAYS: 7
      RETENTION_INTERVAL_MS: 3600000
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:${API_PORT:-8080}"
    restart: unless-stopped

volumes:
  timescale-data:
